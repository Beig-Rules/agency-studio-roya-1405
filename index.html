<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>استودیو رویا | هویت و محصول</title>
<style>
:root{--bg:#0f0f0f;--fg:#f0f0f0;--accent:#e0e0e0}
body.light{--bg:#fff;--fg:#111;--accent:#000}
body{font-family:Vazirmatn,sans-serif;background:var(--bg);color:var(--fg);margin:0}
.hero{padding:120px 20px;text-align:center}
.services{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:30px;max-width:1000px;margin:60px auto;padding:0 20px}
.service{padding:30px;border:1px solid #333;border-radius:8px}
.btn{border:1px solid var(--accent);color:var(--accent);padding:12px 28px;text-decoration:none;display:inline-block;margin-top:20px}
</style>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn&display=swap" rel="stylesheet">
</head>
<body>
<button style="position:absolute;top:20px;left:20px" onclick="document.body.classList.toggle('light')">تم</button>
<section class="hero">
<h1>استودیو رویا</h1>
<p>طراحی هویت بصری و محصول دیجیتال برای برندهای فرهنگی</p>
<a href="#" class="btn">درخواست جلسه</a>
</section>
<section class="services">
<div class="service"><h3>هویت برند</h3><p>لوگو، راهنما و سیستم بصری.</p></div>
<div class="service"><h3>طراحی محصول</h3><p>وب، اپ و تجربه کاربر.</p></div>
<div class="service"><h3>بسته‌بندی</h3><p>طراحی منحصربه‌فرد فرهنگی.</p></div>
</section>
</body>
</html>
